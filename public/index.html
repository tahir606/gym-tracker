<style>
:root{--bg:#0e1013;--card:#181b20;--card2:#20242b;--line:#2a2f38;--text:#eef0f3;--muted:#8b93a1;--accent:#c6f432;--accent-ink:#141a00;--danger:#ff6b6b;--gold:#ffc94d;--tabs-bg:rgba(14,16,19,.94);--g-chest:#3987e5;--g-back:#d95926;--g-shoulders:#199e70;--g-arms:#c98500;--g-legs:#d55181;--g-core:#0ca30c;--g-other:#7c8594;color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f4f5f7;--card:#ffffff;--card2:#eceef2;--line:#d9dde4;--text:#14171c;--muted:#5d6673;--accent:#4d7c0f;--accent-ink:#ffffff;--danger:#cf3a3a;--gold:#ffc94d;--tabs-bg:rgba(255,255,255,.94);--g-chest:#2a78d6;--g-back:#eb6834;--g-shoulders:#1baf7a;--g-arms:#eda100;--g-legs:#e87ba4;--g-core:#008300;--g-other:#8a93a0;color-scheme:light}}
:root[data-theme="light"]{--bg:#f4f5f7;--card:#ffffff;--card2:#eceef2;--line:#d9dde4;--text:#14171c;--muted:#5d6673;--accent:#4d7c0f;--accent-ink:#ffffff;--danger:#cf3a3a;--gold:#ffc94d;--tabs-bg:rgba(255,255,255,.94);--g-chest:#2a78d6;--g-back:#eb6834;--g-shoulders:#1baf7a;--g-arms:#eda100;--g-legs:#e87ba4;--g-core:#008300;--g-other:#8a93a0;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
#main{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 24px}
h1{font-size:26px;margin:6px 0 14px;letter-spacing:-.02em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:64px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.block{display:block;width:100%;padding:13px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.card.tap{cursor:pointer}
.row{display:flex;align-items:center;gap:10px}
.row>.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:13px}.right{text-align:right}
.title{font-weight:650}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile b{display:block;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--gold);color:#2b1f00;vertical-align:middle}
.badge.w{background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.set{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:8px 2px;border-top:1px solid var(--line);cursor:pointer;font-variant-numeric:tabular-nums}
.set .n{color:var(--muted);font-size:13px}
.addset{display:grid;grid-template-columns:1fr 1fr 46px 52px;gap:8px;margin-top:10px}
.addset input{text-align:center;padding:10px 4px}
.addset .btn{padding:10px 0}
.toggle.on{background:var(--card2);border-color:var(--accent);color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:36px 12px}
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--tabs-bg);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
#tabs button{flex:1;max-width:128px;background:none;border:0;padding:9px 0 8px;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer}
#tabs button svg{display:block;margin:0 auto 3px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--accent)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
#sheet{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:88vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
#sheet h3{margin:0 0 10px;font-size:18px}
.pick{padding:11px 4px;border-top:1px solid var(--line);cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;white-space:nowrap}
#toast.show{opacity:1}
.chart{width:100%;height:auto;display:block}
.bars{display:flex;align-items:flex-end;gap:5px;height:70px}
.bars i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.9}
.bars i.z{background:var(--line)}
code{background:var(--card2);padding:2px 6px;border-radius:6px;font-size:13px;word-break:break-all}
.hdr{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.hdr input.name{font-size:20px;font-weight:700;background:none;border-color:transparent;padding:6px 4px}
.hdr input.name:focus{border-color:var(--line)}
#rest{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700;font-size:14px;white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

#tabs button{font-size:10px}
#tip{position:fixed;display:none;z-index:40;background:var(--text);color:var(--bg);font-size:12px;font-weight:600;padding:5px 9px;border-radius:8px;pointer-events:none;max-width:260px;white-space:pre-line}
svg.chart{touch-action:pan-y;cursor:crosshair}
.chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip.on{border-color:var(--accent);color:var(--accent)}
.scope{font-size:11px;color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0;margin-left:6px}
.vb-plot{display:flex;align-items:flex-end;gap:3px;height:110px;border-bottom:1px solid var(--line)}
.vb-col{flex:1;height:100%;display:flex;flex-direction:column-reverse;gap:2px;min-width:0;cursor:default}
.vb-col i{display:block;background:var(--accent);border-radius:4px 4px 0 0;min-height:0}
.vb-col.stack i{border-radius:2px}
.vb-x{display:flex;gap:3px;margin-top:4px}
.vb-x span{flex:1;text-align:center;font-size:10px;color:var(--muted);min-width:0;overflow:hidden;white-space:nowrap}
.vb-cap{margin-bottom:6px}
.hb-row{display:grid;grid-template-columns:minmax(0,38%) 1fr auto;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.hb-row.tap{cursor:pointer}
.hb-track{height:10px;background:var(--card2);border-radius:5px;overflow:hidden}
.hb-track i{display:block;height:100%;border-radius:0 5px 5px 0;background:var(--accent)}
.hb-row b{font-variant-numeric:tabular-nums;font-size:13px;min-width:26px;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.hl{margin:0;padding-left:18px}.hl li{margin:5px 0}
.spark{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spark .tile{cursor:pointer;min-width:0}
.spark svg{display:block;width:100%;height:30px;margin:6px 0 4px}
.spark .nm{font-size:13px;font-weight:650}
.prrow{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.prrow:first-child{border-top:0}

/* ---------- mobile first ---------- */
html{-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
#main{overflow-x:clip}
[data-a]{cursor:pointer;touch-action:manipulation}
button,.chip,.pick,.card.tap,.set,#tabs{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
input,select,textarea{font-size:16px;min-height:46px}
textarea{min-height:84px}
input[type=date]{-webkit-appearance:none;appearance:none;text-align:left;display:block}

input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.btn{min-height:46px;padding:10px 16px}
.btn.ghost{min-width:44px;min-height:44px}
.btn.block{min-height:52px;font-size:17px}
.btn:active{transform:none}
.btn:active,.chip:active,.card.tap:active,.pick:active,.set:active,.tile[data-a]:active,.hb-row.tap:active,.prrow[data-a]:active,#tabs button:active{opacity:.55}
.busy{opacity:.55;pointer-events:none}
.chip{min-height:38px;padding:8px 14px}
.pick{min-height:52px;display:flex;align-items:center;gap:10px;padding:10px 4px}
.set{min-height:46px;padding:6px 2px}
.set.saving{opacity:.6}
.row>*{min-width:0}
#tabs{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--card)}
#tabs button{min-height:56px;max-width:none}
body.kb #tabs,body.locked #tabs{display:none}
body.kb{padding-bottom:20px}
body.locked{overflow:hidden}
.loading{text-align:center;color:var(--muted);padding:30vh 0}
#modal{inset:auto;top:0;left:0;right:0;height:100%;background:var(--bg);flex-direction:column;align-items:stretch;justify-content:flex-start}
.mhead{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 8px 8px 16px;border-bottom:1px solid var(--line);max-width:640px;width:100%;margin:0 auto}
.mhead h3{flex:1;margin:0;font-size:18px}
#sheet{flex:1;min-height:0;max-height:none;border:0;border-radius:0;background:none;margin:0 auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.stick{position:sticky;top:-14px;background:var(--bg);padding:14px 0 8px;margin-top:-14px;z-index:1}
.whdr{position:sticky;top:0;z-index:4;background:var(--bg);margin:calc(-14px - env(safe-area-inset-top)) -16px 10px;padding:calc(6px + env(safe-area-inset-top)) 12px 6px 6px;display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line)}
.whdr input.name{flex:1;font-size:19px;font-weight:700;background:none;border-color:transparent;padding:6px 4px;min-width:0}

.logger{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

.logrow{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:10px}
.logrow .btn{min-height:54px;font-size:17px}
.bwrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:8px}
#sync{position:fixed;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top));z-index:30;background:var(--gold);color:#2b1f00;font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;white-space:nowrap}
.pick.ex{display:block;padding:12px 4px}
.prow{display:flex;align-items:baseline;gap:10px}
.pname{flex:1;min-width:0;font-weight:600}
.pmeta{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45}

.pk{display:inline-block;min-width:34px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}

.steps{margin:0;padding-left:22px;line-height:1.6}
.steps li{margin:4px 0}
.ibanner{margin-bottom:14px;gap:8px}
.ibanner .btn.primary{min-height:40px;padding:8px 16px}
.more{font-size:22px;line-height:1;color:var(--muted);padding:0;margin:-8px -8px -8px 0;flex:0 0 auto}
.pick .more,.card .row .more{align-self:center}
#modal.menu{background:rgba(0,0,0,.5);justify-content:flex-end}
#modal.menu .mhead{background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:14px 8px 4px 20px}

#modal.menu #sheet{flex:0 0 auto;width:100%;max-width:640px;background:var(--card);border:1px solid var(--line);border-top:0;padding:4px 8px calc(12px + env(safe-area-inset-bottom))}
.mlist{display:flex;flex-direction:column}
.mitem{display:flex;align-items:center;width:100%;min-height:52px;padding:0 12px;background:none;border:0;border-radius:12px;color:var(--text);font:inherit;font-size:16px;text-align:left;cursor:pointer}
.mitem:active{background:var(--card2)}

<div id="main"></div>
<nav id="tabs" hidden>
  <button data-a="tab" data-t="home"><svg viewBox="0 0 24 24"><path d="M6 6v12M18 6v12M2.5 9v6M21.5 9v6M6 12h12"/></svg>Log</button>
  <button data-a="tab" data-t="history"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>History</button>

<div id="modal" role="dialog" aria-modal="true"><div class="mhead"><h3 id="mtitle"></h3><button class="btn ghost" data-a="closeModal" aria-label="Close">✕</button></div><div id="sheet"></div></div>
<div id="sync" hidden></div>
<div id="toast"></div>
<div id="tip"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => (n == null || n === '' ? '' : String(+(+n).toFixed(2)));
const big = (n) => (n >= 10000 ? (n / 1000).toFixed(n >= 100000 ? 0 : 1) + 'k' : fmt(Math.round(n)));
const pad = (n) => String(n).padStart(2, '0');
const localDate = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const niceDate = (s) => {
  if (!s) return '';
  if (s === localDate()) return 'Today';
  const d = new Date(s + 'T12:00');
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', ...(d.getFullYear() !== new Date().getFullYear() ? { year: 'numeric' } : {}) });
};
const store = {
  get: (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
function applyTheme(t) {
  store.set('gt_theme', t === 'system' ? null : t);
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
  syncThemeColor();
}
function syncThemeColor() {
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
}
syncThemeColor();
matchMedia('(prefers-color-scheme: light)').addEventListener('change', syncThemeColor);
const GROUPS = ['Chest', 'Back', 'Shoulders', 'Arms', 'Legs', 'Core', 'Cardio', 'Other'];
const EQUIP = ['Barbell', 'Dumbbell', 'Machine', 'Cable', 'Bodyweight', 'Kettlebell', 'Other'];

const S = { token: store.get('gt_token', ''), tab: 'home', view: null, unit: store.get('gt_unit', 'kg'), exercises: [], warm: {}, plates: {}, fold: {}, used: new Set(), restAt: store.get('gt_rest', 0), deferred: false };

// ---------- network, cache and offline queue ----------
async function api(path, method = 'GET', body) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 15000);
  let res;
  try {
    res = await fetch('/api' + path, {
      method,
      signal: ctl.signal,
      headers: { Authorization: 'Bearer ' + S.token, ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (e) {
    const err = new Error(navigator.onLine === false ? 'You are offline' : 'Could not reach the server');
    err.network = true;
    throw err;
  } finally {
    clearTimeout(timer);
  }
  if (res.status === 401) {
    const had = store.get('gt_token');
    logout();
    if (had) render();
    throw new Error('Wrong access key');
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || 'Request failed');
    err.network = res.status >= 500;
    err.status = res.status;
    throw err;
  }
  return data;
}

// Every screen reads through this cache: it paints from the last known data at once,
// then refreshes in the background and repaints only if something changed.
const mem = new Map();
const inflight = new Map();
function cacheRead(path) {
  if (mem.has(path)) return mem.get(path);
  const c = store.get('gc:' + path);
  if (c) { c.json = JSON.stringify(c.data); mem.set(path, c); }
  return c;
}
function cacheWrite(path, data) {
  const c = { t: Date.now(), data, json: JSON.stringify(data) };
  mem.set(path, c);
  store.set('gc:' + path, { t: c.t, data });
  return c;
}
function refresh(path) {

// ---------- offline queue ----------
// Every change is applied on screen at once and stored in this queue, which survives reloads and is sent in
// order whenever there is a connection. Things created offline (workouts, exercises) get a temporary negative
// id that is swapped for the real one once the server has it.
let outbox = store.get('gt_outbox', []).map((op) => (op.kind ? op : { ...op, kind: 'sets' }));
let idmap = store.get('gt_idmap', {});
let pumping = false, retryTimer = 0, syncFailing = false, sendingId = null;
const saveOutbox = () => store.set('gt_outbox', outbox);
const rid = (id) => (id < 0 && idmap[id]) || id;
let tempSeq = 0;
const tempId = () => -(Date.now() * 10 + (tempSeq++ % 10));
const opId = () => 'o' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const nowIso = () => new Date().toISOString();
// When each exercise was added to a workout, kept on the phone until its first set is sent.
const addedKey = (wid) => 'gt_added_' + wid;
function addPending(wid, id) {
  const p = pendingOf(wid);
  if (!p.includes(id)) store.set('gt_pending_' + wid, [...p, id]);

  if (!a[id]) store.set(addedKey(wid), { ...a, [id]: nowIso() });
}
function queue(op) {

// Exercises created offline, until their first set reaches the server.
const localEx = () => store.get('gt_localex', []);
const exById = (id) => S.exercises.find((e) => e.id === id) || localEx().find((e) => e.id === id);

function opRequest(op) {
  const wid = rid(op.wid);
  switch (op.kind) {
    case 'newWorkout': return ['/workouts', 'POST', op.body];
    case 'sets': {
      const ex = rid(op.body.exercise_id);
      const body = { sets: op.body.sets, exercise_added_at: op.body.exercise_added_at, ...(ex > 0 ? { exercise_id: ex } : { exercise: op.exName }) };
      return [`/workouts/${wid}/sets`, 'POST', body];
    }
    case 'patchWorkout': return ['/workouts/' + wid, 'PATCH', op.body];
    case 'delWorkout': return ['/workouts/' + wid, 'DELETE'];
    case 'editSet': return ['/sets/' + op.setId, 'PATCH', op.body];
    case 'delSet': return ['/sets/' + op.setId, 'DELETE'];
    case 'bw': return ['/bodyweight', 'POST', op.body];
    case 'delBw': return ['/bodyweight/' + op.bwId, 'DELETE'];

function synced(op, res) {
  synced.count = (synced.count || 0) + 1;
  if (op.kind === 'newWorkout') return remapWorkout(op.wid, res);
  if (op.kind === 'sets' && rid(op.body.exercise_id) < 0) {
    const e = res.exercises.find((x) => x.name.toLowerCase() === op.exName.toLowerCase());
    if (e) remapExercise(op.body.exercise_id, e.exercise_id);
  }
  if (res && res.exercises) mergeWorkout(res);
  if (op.kind === 'sets') {
    const s = (res.exercises.find((e) => e.exercise_id === rid(op.body.exercise_id)) || { sets: [] }).sets.at(-1);
    if (s && s.is_pr) toast('New PR! 🏆');

  if (op.kind === 'delWorkout') { mem.delete('/workouts/' + rid(op.wid)); store.set('gc:/workouts/' + rid(op.wid), null); }

}
async function pump() {
  if (pumping || !S.token) return;
  pumping = true;
  clearTimeout(retryTimer);
  while (outbox.length) {
    const op = outbox[0];
    sendingId = op.id;
    try {
      const res = await api(...opRequest(op));
      outbox = outbox.filter((o) => o.id !== op.id); saveOutbox();
      syncFailing = false;
      synced(op, res);
    } catch (e) {
      if (e.network) { syncFailing = true; retryTimer = setTimeout(pump, 5000); break; }
      outbox = outbox.filter((o) => o.id !== op.id); saveOutbox();
      // Deleting something that is already gone is fine; anything else is worth knowing about.
      if (!(e.status === 404 && /^del/.test(op.kind))) toast('A change could not be saved: ' + e.message);
      touchAll();

  sendingId = null;
  pumping = false;

function remapWorkout(temp, w) {
  idmap[temp] = w.id; store.set('gt_idmap', idmap);

  saveOutbox();
  if (store.get('gt_active') === temp) store.set('gt_active', w.id);
  const pend = store.get('gt_pending_' + temp);
  if (pend) { store.set('gt_pending_' + w.id, pend); store.set('gt_pending_' + temp, null); }
  const added = store.get(addedKey(temp));
  if (added) { store.set(addedKey(w.id), added); store.set(addedKey(temp), null); }
  mem.delete('/workouts/' + temp); store.set('gc:/workouts/' + temp, null);
  store.set('gt_localw', store.get('gt_localw', []).filter((x) => x !== temp));
  mergeWorkout(w);
  if (S.wk && S.wk.id === temp) S.wk = w;
  if (S.view && S.view.type === 'workout' && S.view.id === temp) {
    S.view = { ...S.view, id: w.id };

}
function remapExercise(temp, real) {

  saveOutbox();
  try {
    for (const k of Object.keys(localStorage)) if (k.startsWith('gt_pending_')) store.set(k, store.get(k, []).map((x) => (x === temp ? real : x)));

  for (const m of [S.warm, S.plates]) if (temp in m) { m[real] = m[temp]; delete m[temp]; }

// While online, quietly load every screen and recent workouts so the whole app works later without signal.

  if (navigator.onLine === false || !S.token) return;

  const paths = ['/stats?today=' + today, '/workouts?limit=4', '/workouts?limit=300', '/exercises', '/prs', `/insights?today=${today}`, '/bodyweight?limit=120', '/settings'];
  try {

// ---------- charts ----------
let CH = {}, chN = 0;

// Line chart with hover crosshair. points: [{x: label, y, avg?}] - when avg is present the raw values recede and the average leads.
function lineChart(points, unit = '', opt = {}) {
  if (points.length < 2) return '<div class="muted small">Not enough data yet for a trend.</div>';
  const W = 360, H = 190, px = 8, pt = 26, pb = 22;
  const hasAvg = points[0].avg != null;
  const ys = points.flatMap((p) => (hasAvg ? [p.y, p.avg] : [p.y]));
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi === lo) { hi += 1; lo -= 1; }
  const X = (i) => px + (i * (W - 2 * px)) / (points.length - 1);
  const Y = (v) => pt + (1 - (v - lo) / (hi - lo)) * (H - pt - pb);
  const path = (k) => points.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p[k]).toFixed(1)}`).join('');
  const id = 'c' + ++chN, last = points.length - 1, main = hasAvg ? 'avg' : 'y';
  CH[id] = { points, unit, W, H, px, hasAvg, ys: points.map((p) => Y(p[main])) };
  const rawYs = points.map((p) => p.y);
  return `<svg class="chart" data-ch="${id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label || 'Trend chart')}">
    <line x1="${px}" x2="${W - px}" y1="${H - pb}" y2="${H - pb}" stroke="var(--line)"/>
    ${hasAvg ? points.map((p, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="2" fill="var(--muted)" opacity=".7"/>`).join('')
      : `<path d="${path('y')}L${X(last)},${H - pb}L${X(0)},${H - pb}Z" fill="var(--accent)" opacity=".1"/>`}
    <path d="${path(main)}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${!hasAvg && points.length <= 30 ? points.map((p, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="2.5" fill="var(--accent)"/>`).join('') : ''}
    <circle cx="${X(last).toFixed(1)}" cy="${Y(points[last][main]).toFixed(1)}" r="4" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>
    <text x="${px}" y="14" fill="var(--muted)" font-size="12">High ${fmt(Math.max(...rawYs))} · Low ${fmt(Math.min(...rawYs))} ${esc(unit)}</text>
    <text x="${W - px}" y="14" fill="var(--text)" font-size="12" font-weight="700" text-anchor="end">Latest ${fmt(points[last].y)} ${esc(unit)}</text>
    <text x="${px}" y="${H - 5}" fill="var(--muted)" font-size="12">${esc(points[0].x)}</text>
    <text x="${W - px}" y="${H - 5}" fill="var(--muted)" font-size="12" text-anchor="end">${esc(points[last].x)}</text>
    <line class="xh" y1="${pt}" y2="${H - pb}" stroke="var(--muted)" stroke-dasharray="3 3" style="visibility:hidden"/>
    <circle class="xm" r="4" fill="var(--text)" stroke="var(--card)" stroke-width="2" style="visibility:hidden"/>
  </svg>${hasAvg ? `<div class="legend"><span><i style="background:var(--accent)"></i>${esc(opt.avgLabel || 'Average')}</span><span><i style="background:var(--muted);border-radius:50%"></i>${esc(opt.rawLabel || 'Each entry')}</span></div>` : ''}`;
}

// Training calendar: one column per week, one cell per day, shaded by sets logged.
function heatmap(days, today) {
  const by = {};
  for (const d of days) by[d.date] = by[d.date] ? { ...by[d.date], sets: by[d.date].sets + d.sets, name: by[d.date].name + ' + ' + d.name } : d;
  const start = UD(days[0].date);
  start.setUTCDate(start.getUTCDate() - ((start.getUTCDay() + 6) % 7));
  const end = UD(today), C = 13, top = 16;
  let cells = '', labels = '', w = 0, lastMonth = -1;
  for (const d = new Date(start); d <= end; d.setUTCDate(d.getUTCDate() + 1)) {
    const dow = (d.getUTCDay() + 6) % 7, key = iso(d), e = by[key];
    if (dow === 0 && d.getUTCMonth() !== lastMonth && d.getUTCDate() <= 7) {
      lastMonth = d.getUTCMonth();
      labels += `<text x="${w * C}" y="10" fill="var(--muted)" font-size="10">${d.toLocaleDateString(undefined, { month: 'short', timeZone: 'UTC' })}</text>`;
    }
    const lvl = !e ? 0 : e.sets > 10 ? 1 : e.sets > 5 ? 0.65 : 0.35;
    const when = d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
    cells += `<rect x="${w * C}" y="${top + dow * C}" width="11" height="11" rx="2.5" fill="${e ? 'var(--accent)' : 'var(--card2)'}"${e ? ` fill-opacity="${lvl}"` : ''}${tipAttr(e ? `${when}\n${e.name} · ${e.sets} sets` : `${when}\nRest`)}/>`;
    if (dow === 6) w++;
  }
  const width = (w + 1) * C;
  return `<div class="hscroll scroll-end"><svg width="${width}" height="${top + 7 * C}" viewBox="0 0 ${width} ${top + 7 * C}" role="img" aria-label="Training calendar">${labels}${cells}</svg></div>
    <div class="legend"><span>Fewer sets</span><span>${[0.35, 0.65, 1].map((o) => `<i style="background:var(--accent);opacity:${o};margin-right:3px"></i>`).join('')}More sets</span><span><i style="background:var(--card2)"></i>Rest day</span></div>`;
}

    const r = svg.getBoundingClientRect(), n = c.points.length;
    const vx = ((e.clientX - r.left) / r.width) * c.W;
    const i = Math.max(0, Math.min(n - 1, Math.round(((vx - c.px) / (c.W - 2 * c.px)) * (n - 1))));
    const x = c.px + (i * (c.W - 2 * c.px)) / (n - 1), p = c.points[i];
    document.querySelectorAll('.xh,.xm').forEach((el) => (el.style.visibility = 'hidden'));
    const xh = svg.querySelector('.xh'), xm = svg.querySelector('.xm');
    xh.setAttribute('x1', x); xh.setAttribute('x2', x); xh.style.visibility = 'visible';
    xm.setAttribute('cx', x); xm.setAttribute('cy', c.ys[i]); xm.style.visibility = 'visible';
    return showTip(`${p.x}\n${fmt(p.y)} ${c.unit}${c.hasAvg ? ` · avg ${fmt(p.avg)}` : ''}`, e.clientX, r.top + (c.ys[i] / c.H) * r.height, touch);
  }
  if (touch && e.type === 'pointermove') return; // scrolling with a finger must stay cheap
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el) showTip(el.dataset.tip, e.clientX, el.getBoundingClientRect().top + 4, touch);
  else hideTip();
}
document.addEventListener('pointermove', hover, { passive: true });
document.addEventListener('pointerdown', hover, { passive: true });
document.addEventListener('scroll', hideTip, { capture: true, passive: true });

function exerciseList(q) {
  q = q.trim().toLowerCase();
  const list = S.exercises.filter((e) => !q || e.name.toLowerCase().includes(q) || e.muscle_group.toLowerCase().includes(q));
  if (!list.length) return '<div class="empty">No matches.</div>';
  const groups = [...new Set([...GROUPS, ...list.map((e) => e.muscle_group)])];
  return groups.map((g) => {
    const items = list.filter((e) => e.muscle_group === g);
    return items.length ? `<h2>${esc(g)}</h2><div class="card" style="padding:2px 14px">${items.map((e, i) => `<div class="pick row" style="${i ? '' : 'border-top:0'}" data-a="openExercise" data-id="${e.id}">
      <div class="grow trunc">${esc(e.name)}</div><div class="muted small">${e.last_used ? niceDate(e.last_used) : esc(e.equipment)}</div>
      <button class="btn ghost more" data-a="exLibMenu" data-id="${e.id}" aria-label="Options for ${esc(e.name)}">⋯</button></div>`).join('')}</div>` : '';
  }).join('');
}

// ---------- workout screen ----------
const pendingOf = (id) => store.get('gt_pending_' + id, []);
const isPlatesSet = (s) => /^plates\b/.test((s && s.notes) || '');

// What is on screen = the server's copy + queued changes (new, edited and deleted sets) + exercises added but not used yet.
function workoutCards(w) {
  const cards = w.exercises.map((e) => ({ ...e, sets: e.sets.slice() }));
  const card = (id) => {
    let c = cards.find((x) => x.exercise_id === id);
    if (!c) { c = { exercise_id: id, name: (exById(id) || {}).name || 'Exercise', sets: [] }; cards.push(c); }
    return c;
  };
  for (const op of outbox) {
    if (rid(op.wid) !== w.id) continue;
    if (op.kind === 'sets') {
      for (const st of op.body.sets) card(rid(op.body.exercise_id)).sets.push({ id: op.id, weight: +st.weight, reps: +st.reps, is_warmup: st.warmup ? 1 : 0, notes: st.notes || '', saving: true });
    }
    if (op.kind === 'editSet' || op.kind === 'delSet') {
      for (const c of cards) {
        const i = c.sets.findIndex((x) => x.id === op.setId);
        if (i < 0) continue;
        if (op.kind === 'delSet') c.sets.splice(i, 1);
        else { const b = op.body; c.sets[i] = { ...c.sets[i], weight: +b.weight, reps: +b.reps, rpe: b.rpe ? +b.rpe : null, is_warmup: b.warmup ? 1 : 0, notes: b.notes, is_pr: 0 }; }
      }
    }
  }
  for (const pid of pendingOf(w.id)) { const x = rid(pid); if (exById(x)) card(x); }
  return cards;
}
function workoutMeta(w) {
  const m = { name: w.name, notes: w.notes, date: w.date };
  for (const op of outbox) if (op.kind === 'patchWorkout' && rid(op.wid) === w.id) Object.assign(m, op.body);
  return m;
}
function setsHtml(c) {
  let n = 0;
  return c.sets.map((s) => `<div class="set${s.saving ? ' saving' : ''}" data-a="${s.saving ? 'pendingSet' : 'setMenu'}" data-id="${s.id}">
    <div class="n">${s.is_warmup ? 'W' : ++n}</div>
    <div>${setText(s)}${s.rpe ? ` <span class="muted small">RPE ${fmt(s.rpe)}</span>` : ''}${noteOf(s) ? ` <span class="muted small">· ${esc(noteOf(s))}</span>` : ''}</div>
    <div>${s.saving ? '<span class="muted small">saving…</span>' : s.is_pr ? '<span class="badge">PR</span>' : s.is_warmup ? '<span class="badge w">warm-up</span>' : ''}</div></div>`).join('');
}
function totalsText(cards) {
  const sets = cards.flatMap((c) => c.sets);
  const vol = sets.reduce((v, s) => v + (s.is_warmup || isPlatesSet(s) ? 0 : s.weight * s.reps), 0);
  return `${sets.length} set${sets.length === 1 ? '' : 's'} · ${big(vol)} ${S.unit}`;
}
// "Last time" for an exercise: from the workout itself, or else from the exercise library (works offline).
function prevOf(w, id) {
  if (w.previous[id]) return w.previous[id];
  const e = exById(id);
  return e && e.last && e.last.workout_id !== w.id ? e.last : null;
}
// Is this exercise logged as machine plates rather than weight? Follows the last set unless switched by hand.
function usesPlates(w, c) {
  if (S.plates[c.exercise_id] != null) return S.plates[c.exercise_id];
  const prev = prevOf(w, c.exercise_id);
  return isPlatesSet(c.sets.at(-1) || (prev && prev.sets.at(-1)));
}
// Finished exercises fold into one line. The exercise being worked on (the last one a set was logged to,
// or the one just added) stays open, as does any exercise without sets; a tap on a header opens or folds it.
// A past workout opens fully folded.
// The workout being done right now (Finish applies only to this one); anything else is a past workout.
const inProgress = (w) => rid(store.get('gt_active')) === w.id;
const curKey = (w) => 'gt_cur_' + rid(w.id);
function currentEx(w) {
  const cur = store.get(curKey(w));
  if (cur != null) return rid(cur);
  if (rid(store.get('gt_active')) !== w.id) return null;
  const withSets = workoutCards(w).filter((c) => c.sets.length);
  return withSets.length ? withSets.at(-1).exercise_id : null;
}
function setCurrent(id) {
  if (!S.wk || currentEx(S.wk) === id) return;
  store.set(curKey(S.wk), id);
  S.fold = {};
}
function isCollapsed(w, c) {
  if (!c.sets.length) return false;
  if (S.fold[c.exercise_id] != null) return S.fold[c.exercise_id];
  return c.exercise_id !== currentEx(w);
}
function summaryOf(c) {
  if (!c.sets.length) return 'No sets yet';
  const work = c.sets.filter((s) => !s.is_warmup);
  const n = `${c.sets.length} set${c.sets.length === 1 ? '' : 's'}`;
  const pr = c.sets.some((s) => s.is_pr) ? ' · 🏆 PR' : '';
  return `${n} · ${(work.length ? work : c.sets).map(shortSet).join(', ')}${pr}`;
}
function applyFolding(cards) {
  for (const c of cards) {
    const el = $('#card-' + c.exercise_id);
    if (!el) continue;
    el.classList.toggle('collapsed', isCollapsed(S.wk, c));
    el.classList.toggle('nosets', !c.sets.length);
    const sum = $('#sum-' + c.exercise_id);
    if (sum) sum.textContent = summaryOf(c);
  }
}
// Update only the set lists and totals, leaving the inputs (and the keyboard) alone.
function paintWorkout() {
  syncBadge();
  if (!S.view || S.view.type !== 'workout' || !S.wk || S.wk.id !== rid(S.view.id)) return;
  const cards = workoutCards(S.wk);
  for (const c of cards) {
    const box = $('#sets-' + c.exercise_id);
    if (!box) return softRender();
    box.innerHTML = setsHtml(c);
    const rm = c.sets.length && document.querySelector(`#card-${c.exercise_id} [data-a="dropPending"]`);
    if (rm) rm.remove();
  }
  const t = $('#wtotals');
  if (t) t.textContent = totalsText(cards);
  applyFolding(cards);
}

async function vWorkout(id) {
  if (!S.exercises.length) S.exercises = await get('/exercises').catch(() => []);
  const w = await get('/workouts/' + rid(id));
  if (!S.wk || S.wk.id !== w.id) S.fold = {};
  S.wk = w;
  const meta = workoutMeta(w);
  const cards = workoutCards(w);
  const card = (c) => {
    const prev = prevOf(w, c.exercise_id);
    const lastSet = c.sets.at(-1) || (prev && (prev.sets.filter((s) => !s.is_warmup)[0] || prev.sets[0]));
    const pl = usesPlates(w, c), x = c.exercise_id, pr = (exById(x) || {}).pr;
    return `<div class="card ex${isCollapsed(w, c) ? ' collapsed' : ''}${c.sets.length ? '' : ' nosets'}" id="card-${x}">
      <div class="row exhead" data-a="toggleCard" data-id="${x}"><div class="grow" style="min-width:0"><div class="title trunc">${esc(c.name)}</div>
          <div class="exsum muted small trunc" id="sum-${x}">${summaryOf(c)}</div></div>
        <span class="chev" aria-hidden="true"></span>
        <button class="btn ghost more" data-a="exCardMenu" data-id="${x}" aria-label="Options for ${esc(c.name)}">⋯</button></div>
      <div class="exbody">
      <div class="muted small" style="margin-bottom:6px">${prev ? `Last (${niceDate(prev.date)}): ${prev.sets.filter((s) => !s.is_warmup).map(shortSet).join(', ') || 'warm-ups only'}` : 'First time logging this'}${pr ? `<br>PR: ${recText(pr)} (${niceDate(pr.date)})` : ''}</div>
      <div id="sets-${x}">${setsHtml(c)}</div>
      <div class="logger">
        <div><div class="cap"><span id="ucap-${x}">Weight (${pl ? 'plates' : S.unit})</span><button data-a="toggleUnit" data-id="${x}" id="ubtn-${x}">use ${pl ? S.unit : 'plates'}</button></div>
          <div class="stepper"><button data-a="step" data-f="w" data-id="${x}" data-d="-1" aria-label="Less weight">−</button>
            <input id="w-${x}" type="number" inputmode="decimal" step="any" placeholder="0" value="${lastSet ? fmt(lastSet.weight) : ''}" aria-label="Weight" enterkeyhint="next">
            <button data-a="step" data-f="w" data-id="${x}" data-d="1" aria-label="More weight">+</button></div></div>
        <div><div class="cap"><span>Reps</span></div>
          <div class="stepper"><button data-a="step" data-f="r" data-id="${x}" data-d="-1" aria-label="Fewer reps">−</button>
            <input id="r-${x}" type="number" inputmode="numeric" placeholder="0" value="${lastSet && lastSet.reps ? lastSet.reps : ''}" aria-label="Reps" enterkeyhint="done">
            <button data-a="step" data-f="r" data-id="${x}" data-d="1" aria-label="More reps">+</button></div></div>
      </div>
      <div class="logrow"><button class="btn toggle ${S.warm[x] ? 'on' : ''}" data-a="warm" data-id="${x}">Warm-up</button>
        <button class="btn primary" data-a="addSet" data-id="${x}">Log set</button></div></div></div>`;
  };
  return `<div class="whdr"><button class="btn ghost" data-a="back" aria-label="Back">←</button>
      <input class="name" id="wname" value="${esc(meta.name)}" aria-label="Workout name" enterkeyhint="done"><span id="rest"></span>
      <button class="btn ghost more" data-a="workoutScreenMenu" aria-label="Workout options">⋯</button></div>
    <div class="row" style="margin-bottom:12px"><input id="wdate" type="date" value="${meta.date}" style="width:auto;flex:0 0 auto" aria-label="Workout date"><div id="wtotals" class="grow right muted small">${totalsText(cards)}</div></div>
    ${cards.map(card).join('') || '<div class="empty">Add your first exercise to start logging sets.</div>'}
    <button class="btn block" data-a="pickExercise">+ Add exercise</button>
    <label for="wnotes">Notes</label><textarea id="wnotes" placeholder="How did it go?">${esc(meta.notes)}</textarea>
    ${inProgress(w) ? '<button class="btn primary block" style="margin-top:14px" data-a="finish">Finish workout</button>' : ''}
    <div class="grid2" style="margin-top:${inProgress(w) ? 8 : 14}px"><button class="btn" data-a="repeatWorkout" data-id="${w.id}">Repeat as new</button><button class="btn danger" data-a="deleteWorkout" data-id="${w.id}">Delete</button></div>`;
}

async function vExercise(id) {
  const d = await get('/exercises/' + id);
  const e = d.exercise, r = d.records;
  S.ex = e;
  const weighted = !!r.best_e1rm;
  const eu = (r.heaviest && r.heaviest.unit) || S.unit;
  const metrics = weighted ? [['e1rm', 'Est. 1RM', eu], ['top', 'Top weight', eu], ['vol', 'Volume', eu], ['reps', 'Best reps', 'reps']] : [['reps', 'Best reps', 'reps']];
  const metric = metrics.find((m) => m[0] === S.exMetric) || metrics[0];
  const work = (s) => s.sets.filter((x) => !x.is_warmup);
  const val = { e1rm: (s) => s.best_e1rm, top: (s) => s.top_weight, vol: (s) => s.volume, reps: (s) => Math.max(...work(s).map((x) => x.reps)) }[metric[0]];
  const pts = d.sessions.slice().reverse().filter((s) => work(s).length).map((s) => ({ x: niceDate(s.date), y: val(s) }));
  const rec = (label, v, text) => (v ? `<div class="tile"><b>${text}</b><span>${label} · ${niceDate(v.date)}</span></div>` : '');
  return `<div class="whdr"><button class="btn ghost" data-a="back" aria-label="Back">←</button><h1 class="grow trunc" style="margin:0;font-size:20px">${esc(e.name)}</h1><button class="btn ghost more" data-a="exLibMenu" data-id="${e.id}" aria-label="Exercise options">⋯</button></div>
    <div class="muted small">${esc(e.muscle_group)} · ${esc(e.equipment)} · ${d.total_sessions} session${d.total_sessions === 1 ? '' : 's'}</div>
    ${e.notes ? `<div class="card small" style="margin-top:10px">${esc(e.notes)}</div>` : ''}
    <h2>Records</h2>
    ${r.most_reps ? `<div class="tiles" style="grid-template-columns:1fr 1fr">
      ${rec('Est. 1RM', r.best_e1rm, r.best_e1rm && `${fmt(r.best_e1rm.value)} ${r.best_e1rm.unit || S.unit}`)}
      ${rec('Heaviest', r.heaviest, r.heaviest && recText(r.heaviest))}
      ${rec('Most reps', r.most_reps, `${r.most_reps.reps}${r.most_reps.weight ? ` @ ${fmt(r.most_reps.weight)}` : ''}`)}
      ${rec('Best set volume', r.best_volume_set, r.best_volume_set && `${fmt(r.best_volume_set.value)} ${r.best_volume_set.unit || S.unit}`)}
    </div>` : '<div class="muted small">No working sets logged yet.</div>'}
    <h2>${metric[1]} per session</h2>
    ${metrics.length > 1 ? `<div class="chips">${metrics.map((m) => `<button class="chip${m === metric ? ' on' : ''}" data-a="exMetric" data-m="${m[0]}">${m[1]}</button>`).join('')}</div>` : ''}
    <div class="card">${lineChart(pts, metric[2], { label: metric[1] + ' per session' })}</div>
    <h2>History</h2>
    ${d.sessions.map((s) => `<div class="card tap" data-a="openWorkout" data-id="${s.workout_id}">
      <div class="row"><div class="grow title trunc">${niceDate(s.date)}</div><div class="muted small trunc">${esc(s.workout_name)}</div></div>
      <div class="small">${s.sets.map((x) => (x.is_warmup ? `<span class="muted">${shortSet(x)}</span>` : shortSet(x))).join(' · ')}</div></div>`).join('') || '<div class="muted small">Nothing yet.</div>'}`;
}

// ---------- rendering and navigation ----------
let renderSeq = 0;
const routeKey = () => (S.view ? S.view.type + ':' + S.view.id : 'tab:' + S.tab);
const scrolls = {};

async function render(opt = {}) {
  const seq = ++renderSeq;
  S.used = new Set();
  CH = {}; chN = 0;
  const main = $('#main');
  $('#tabs').hidden = !S.token;
  if (!S.token) { main.innerHTML = loginView(); return; }
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', !S.view && b.dataset.t === S.tab));
  // Cached screens paint within this tick; anything slower shows a placeholder instead of a frozen page.
  let done = false;
  if (!opt.soft) setTimeout(() => { if (!done && seq === renderSeq) main.innerHTML = '<div class="loading">Loading…</div>'; }, 150);
  let html;
  try {
    html = S.view && S.view.type === 'workout' ? await vWorkout(S.view.id) : S.view && S.view.type === 'exercise' ? await vExercise(S.view.id) : await views[S.tab]();
  } catch (e) {
    if (!S.token) return render();
    if (S.view && e.status === 404) {
      if (S.view.type === 'workout' && rid(store.get('gt_active')) === rid(S.view.id)) store.set('gt_active', null);
      S.view = null;
      history.replaceState({ tab: S.tab, view: null, depth: depth() }, '');
      return render();
    }
    html = `<div class="empty">${esc(e.message)}<br><br><button class="btn" data-a="retry">Try again</button></div>`;
  }
  done = true;
  if (seq !== renderSeq) return;
  // A background refresh must not wipe what is being typed.
  const keep = {};
  if (opt.soft) main.querySelectorAll('input[id],textarea[id]').forEach((el) => { if (el.value !== el.defaultValue) keep[el.id] = el.value; });
  main.innerHTML = html;
  for (const [id, v] of Object.entries(keep)) { const el = document.getElementById(id); if (el && el.type !== 'date') el.value = v; }
  if (keep.exq) $('#exlist').innerHTML = exerciseList(keep.exq);
  hideTip();
  syncBadge();
  main.querySelectorAll('.scroll-end').forEach((el) => (el.scrollLeft = el.scrollWidth));
  if (opt.scroll != null) window.scrollTo(0, opt.scroll);
}
// Repaint after fresh data arrives, but never while the user is in a field (it would close the keyboard).
function softRender() {
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && $('#main').contains(a)) { S.deferred = true; return; }
  if (modalOpen()) { S.deferred = true; return; }
  S.deferred = false;
  render({ soft: true });
}
function setRoute(tab, view, push) {
  scrolls[routeKey()] = window.scrollY;
  S.tab = tab; S.view = view;
  const st = { tab, view, depth: depth() + (push ? 1 : 0) };
  if (push) history.pushState(st, ''); else history.replaceState(st, '');
  window.scrollTo(0, 0);
  return render();
}
const go = (view) => setRoute(S.tab, view, true);
function goBack() { if (depth() > 0) history.back(); else setRoute(S.tab, null, false); }
window.addEventListener('popstate', (e) => {
  const st = e.state || { tab: 'home', view: null };
  if (modalOpen()) hideModal();
  if (popWait) { const done = popWait; popWait = null; done(); }
  if (st.modal) return history.back(); // a dialog cannot be re-opened by going forward
  if (st.tab === S.tab && JSON.stringify(st.view) === JSON.stringify(S.view)) { if (S.deferred) softRender(); return; }
  scrolls[routeKey()] = window.scrollY;
  S.tab = st.tab; S.view = st.view && { ...st.view, id: rid(st.view.id) };
  render({ scroll: scrolls[routeKey()] || 0 });
});

const loginView = () => `<div style="max-width:340px;margin:18vh auto 0;text-align:center">
  <h1>Gym Log</h1><p class="muted">Enter your access key to open your log.</p>
  <form id="login"><input id="key" type="password" placeholder="Access key" autocomplete="current-password" aria-label="Access key" enterkeyhint="go">
  <button class="btn primary block" style="margin-top:10px">Open</button><div id="lerr" class="small" style="color:var(--danger);margin-top:10px"></div></form></div>`;
function logout() {
  S.token = ''; S.view = null;
  store.set('gt_token', null);
  mem.clear(); outbox = [];
  try { for (const k of Object.keys(localStorage)) if (k.startsWith('gc:') || k === 'gt_outbox') localStorage.removeItem(k); } catch {}
}

// ---------- actions ----------
const A = {
  tab(el) { setRoute(el.dataset.t, null, false); },
  back() { goBack(); },
  retry() { render(); },
  openWorkout(el) { go({ type: 'workout', id: +el.dataset.id }); },
  async openExercise(el) { await closeModal(); go({ type: 'exercise', id: +el.dataset.id }); },
  logout() { logout(); render(); },
  range(el) { S.range = el.dataset.r; render({ soft: true }); },
  exMetric(el) { S.exMetric = el.dataset.m; render({ soft: true }); },

  // Workouts are created on the phone first, so starting one never waits for the network.
  startWorkout(name, pending) {
    const id = tempId(), date = localDate();
    cacheWrite('/workouts/' + id, { id, date, name, notes: '', set_count: 0, volume: 0, exercises: [], previous: {} });
    store.set('gt_localw', [...store.get('gt_localw', []), id]);
    if (pending) store.set('gt_pending_' + id, pending);
    store.set('gt_active', id);
    queue({ kind: 'newWorkout', wid: id, body: { date, name, started_at: nowIso() } });
    return id;
  },
  async newWorkout() {
    const h = new Date().getHours();
    const id = A.startWorkout((h < 12 ? 'Morning' : h < 17 ? 'Afternoon' : 'Evening') + ' workout');
    await go({ type: 'workout', id });
    A.pickExercise();
  },
  finish() {
    const w = S.wk;
    const cards = workoutCards(w);
    const prs = cards.flatMap((c) => c.sets).filter((s) => s.is_pr).length;
    // Only the workout in progress gets a finish time; reviewing an old one leaves it alone.
    if (rid(store.get('gt_active')) === w.id) queue({ kind: 'patchWorkout', wid: w.id, body: { finished_at: nowIso() } });
    store.set('gt_active', null);
    store.set('gt_pending_' + w.id, null);
    store.set(addedKey(w.id), null);
    S.restAt = 0; store.set('gt_rest', null);
    touchAll();
    goBack();
    toast(`Saved · ${totalsText(cards).split(' · ')[0]}${prs ? ` · ${prs} PR${prs > 1 ? 's' : ''} 🏆` : ''}${outbox.length ? ' · will sync when online' : ''}`);
  },

  async pickExercise() {
    S.exercises = await get('/exercises').catch(() => S.exercises);
    // Refresh in the background so "last" and PR reflect sets logged just now.
    refresh('/exercises').then((d) => { S.exercises = d; if (modalOpen() && $('#plist')) fillPicker($('#pq').value); }).catch(() => {});
    modal('Add exercise', `<div class="stick"><input id="pq" type="search" placeholder="Search or type a new name" autocomplete="off" enterkeyhint="search"></div><div id="plist"></div>`);
    fillPicker('');
    if (matchMedia('(pointer:fine)').matches) $('#pq').focus();
  },
  async choose(el) {
    let id = +el.dataset.id;
    if (!id) {
      // Created on the server together with its first set, so this works offline too.
      id = tempId();
      store.set('gt_localex', [...localEx(), { id, name: el.dataset.name, muscle_group: 'Other', equipment: 'Other', last: null, pr: null }]);
    }
    addPending(S.view.id, id);
    setCurrent(id);
    await closeModal();
    await render({ soft: true });
    const card = $('#card-' + id);
    if (card) card.scrollIntoView({ block: 'center', behavior: 'smooth' });
  },
  dropPending(el) { store.set('gt_pending_' + S.view.id, pendingOf(S.view.id).filter((x) => x !== +el.dataset.id)); render({ soft: true }); },
  warm(el) { const id = el.dataset.id; S.warm[id] = !S.warm[id]; el.classList.toggle('on', S.warm[id]); },
  toggleUnit(el) {
    const id = +el.dataset.id;
    const c = workoutCards(S.wk).find((x) => x.exercise_id === id);
    const pl = (S.plates[id] = !usesPlates(S.wk, c));
    $('#ucap-' + id).textContent = `Weight (${pl ? 'plates' : S.unit})`;
    $('#ubtn-' + id).textContent = `use ${pl ? S.unit : 'plates'}`;
  },
  step(el) {
    const id = +el.dataset.id, inp = $(`#${el.dataset.f}-${id}`);
    let by = 1;
    if (el.dataset.f === 'w') {
      const c = workoutCards(S.wk).find((x) => x.exercise_id === id);
      by = usesPlates(S.wk, c) ? 1 : S.unit === 'lb' ? 5 : 2.5;
    }
    inp.value = fmt(Math.max(0, (+inp.value || 0) + by * +el.dataset.d));
  },
  // Appears on screen immediately; the request goes through the offline queue.
  addSet(el) {
    const id = +el.dataset.id, wid = S.view.id;
    const weight = +$('#w-' + id).value || 0, reps = Math.round(+$('#r-' + id).value || 0);
    if (reps <= 0) { toast('Enter reps'); return; }
    const c = workoutCards(S.wk).find((x) => x.exercise_id === id);
    setCurrent(id);
    const t = nowIso();
    queue({ kind: 'sets', wid, exName: (exById(id) || {}).name,
      body: { exercise_id: id, exercise_added_at: store.get(addedKey(wid), {})[id] || t, sets: [{ weight, reps, warmup: !!S.warm[id], notes: usesPlates(S.wk, c) ? 'plates' : '', logged_at: t }] } });
    if (S.warm[id]) { S.warm[id] = false; const b = $(`[data-a="warm"][data-id="${id}"]`); if (b) b.classList.remove('on'); }
    S.restAt = Date.now(); store.set('gt_rest', S.restAt);
    if (navigator.vibrate) navigator.vibrate(12);
    paintWorkout();
  },
  // A set that has not reached the server yet can only be removed.
  pendingSet(el) {
    const op = outbox.find((o) => o.id === el.dataset.id);
    if (!op) return;
    if (op.id === sendingId) return toast('Saving this set right now…');
    if (!confirm(`${syncFailing || navigator.onLine === false ? 'This set is waiting for a connection.' : 'This set is still saving.'}\nRemove it?`)) return;
    outbox = outbox.filter((o) => o.id !== op.id); saveOutbox();
    paintWorkout();
  },
  editSet(el) {
    const s = workoutCards(S.wk).flatMap((c) => c.sets).find((x) => x.id === +el.dataset.id);
    if (!s) return;
    modal('Edit set', `<div class="grid2"><div><label for="es-w">Weight (${unitOf(s)})</label><input id="es-w" type="number" inputmode="decimal" step="any" value="${fmt(s.weight)}"></div>
      <div><label for="es-r">Reps</label><input id="es-r" type="number" inputmode="numeric" value="${s.reps}"></div></div>
      <div class="grid2"><div><label for="es-rpe">RPE (optional)</label><input id="es-rpe" type="number" inputmode="decimal" step="0.5" min="1" max="10" value="${fmt(s.rpe)}"></div>
      <div><label for="es-wu">Type</label><select id="es-wu"><option value="0">Working set</option><option value="1"${s.is_warmup ? ' selected' : ''}>Warm-up</option></select></div></div>
      <label for="es-n">Note</label><input id="es-n" value="${esc(s.notes)}" enterkeyhint="done">
      <div class="grid2" style="margin-top:16px"><button class="btn danger" data-a="delSet" data-id="${s.id}">Delete set</button><button class="btn primary" data-a="saveSet" data-id="${s.id}">Save</button></div>`);
  },
  async saveSet(el) {
    const setId = +el.dataset.id;
    const body = { weight: $('#es-w').value || 0, reps: $('#es-r').value || 0, rpe: $('#es-rpe').value || null, warmup: $('#es-wu').value === '1', notes: $('#es-n').value };
    outbox = outbox.filter((o) => !(o.kind === 'editSet' && o.setId === setId && o.id !== sendingId));
    queue({ kind: 'editSet', wid: S.wk.id, setId, body });
    await closeModal();
    paintWorkout();
  },
  async delSet(el) {
    const setId = +el.dataset.id;
    outbox = outbox.filter((o) => !(o.kind === 'editSet' && o.setId === setId && o.id !== sendingId));
    queue({ kind: 'delSet', wid: S.wk.id, setId });
    await closeModal();
    paintWorkout();
  },

  editExercise(el) {
    const e = el.dataset.id ? S.ex : { name: '', muscle_group: 'Other', equipment: 'Other', notes: '' };
    modal(`${e.id ? 'Edit' : 'New'} exercise`, `<label for="ee-n" style="margin-top:0">Name</label><input id="ee-n" value="${esc(e.name)}" enterkeyhint="done">
      <div class="grid2"><div><label for="ee-g">Muscle group</label><select id="ee-g">${opts(GROUPS, e.muscle_group)}</select></div>
      <div><label for="ee-q">Equipment</label><select id="ee-q">${opts(EQUIP, e.equipment)}</select></div></div>
      <label for="ee-t">Notes (cues, setup)</label><textarea id="ee-t">${esc(e.notes)}</textarea>
      <div class="grid2" style="margin-top:16px">${e.id ? `<button class="btn danger" data-a="delExercise" data-id="${e.id}">Delete</button>` : '<button class="btn" data-a="closeModal">Cancel</button>'}
      <button class="btn primary" data-a="saveExercise" data-id="${e.id || ''}">Save</button></div>`);
  },
  async saveExercise(el) {
    const body = { name: $('#ee-n').value, muscle_group: $('#ee-g').value, equipment: $('#ee-q').value, notes: $('#ee-t').value };
    const ex = await (el.dataset.id ? api('/exercises/' + el.dataset.id, 'PATCH', body) : api('/exercises', 'POST', body));
    S.exercises = []; touchAll();
    mem.delete('/exercises/' + ex.id);
    await closeModal();
    render({ soft: true });
  },
  async delExercise(el) {
    if (!confirm('Delete this exercise and every set logged for it?')) return;
    await api('/exercises/' + el.dataset.id, 'DELETE');
    S.exercises = []; touchAll();
    await closeModal();
    if (S.view && S.view.type === 'exercise') goBack(); else render({ soft: true });
    toast('Exercise deleted');
  },
  closeModal() { return closeModal(); },
  // ---------- action menus ----------
  // Runs the chosen menu item once the menu has closed, passing along the item's data-* values.
  async menuGo(el) {
    const data = { ...el.dataset };
    await closeModal();
    return A[data.go]({ dataset: data });
  },
  workoutMenu(el) {
    const id = el.dataset.id;
    menu(el.dataset.name || 'Workout', [
      ['Open', 'openWorkout', { id }],
      ['Repeat as a new workout', 'repeatWorkout', { id }],
      ['Share or copy as text', 'shareWorkout', { id }],
      ['Delete workout', 'deleteWorkout', { id }, { danger: true }],
    ]);
  },
  workoutScreenMenu() {
    const id = S.wk.id;
    menu(workoutMeta(S.wk).name, [
      ['Add exercise', 'pickExercise'],
      ['Rename', 'focusName'],
      ['Change date', 'pickDate'],
      ['Share or copy as text', 'shareWorkout', { id }],
      ['Repeat as a new workout', 'repeatWorkout', { id }],
      inProgress(S.wk) && ['Finish workout', 'finish'],
      ['Delete workout', 'deleteWorkout', { id }, { danger: true }],
    ]);
  },
  toggleCard(el) {
    const id = +el.dataset.id, c = workoutCards(S.wk).find((x) => x.exercise_id === id);
    if (!c || !c.sets.length) return;
    S.fold[id] = !isCollapsed(S.wk, c);
    applyFolding([c]);
    if (!S.fold[id]) $('#card-' + id).scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  },
  exCardMenu(el) {
    const id = +el.dataset.id, c = workoutCards(S.wk).find((x) => x.exercise_id === id);
    if (!c) return;
    const prev = prevOf(S.wk, id), pl = usesPlates(S.wk, c);
    menu(c.name, [
      c.sets.length && ['Log the same as the last set', 'repeatSet', { id }],
      prev && ['Copy all sets from last time', 'copyLast', { id }],
      [pl ? `Switch to ${S.unit}` : 'Switch to machine plates', 'toggleUnit', { id }],
      c.sets.length && [isCollapsed(S.wk, c) ? 'Expand' : 'Collapse', 'toggleCard', { id }],
      id > 0 && ['History & progress', 'openExercise', { id }],
      ['Remove from workout', 'removeExercise', { id }, { danger: true }],
    ]);
  },
  setMenu(el) {
    const id = +el.dataset.id, s = workoutCards(S.wk).flatMap((c) => c.sets).find((x) => x.id === id);
    if (!s) return;
    menu(`${s.is_warmup ? 'Warm-up' : 'Set'} · ${setText(s)}`, [
      ['Edit', 'editSet', { id }],
      ['Duplicate', 'dupSet', { id }],
      [s.is_warmup ? 'Mark as working set' : 'Mark as warm-up', 'toggleWarmSet', { id }],
      ['Delete set', 'delSet', { id }, { danger: true }],
    ]);
  },
  exLibMenu(el) {
    const id = +el.dataset.id, e = exById(id) || (S.ex && S.ex.id === id ? S.ex : {});
    const active = store.get('gt_active');
    menu(e.name || 'Exercise', [
      !(S.view && S.view.type === 'exercise') && ['History & progress', 'openExercise', { id }],
      active && ['Add to current workout', 'addToWorkout', { id }],
      ['Start a new workout with this', 'startWith', { id }],
      ['Edit', 'editExerciseId', { id }],
      ['Delete exercise', 'delExercise', { id }, { danger: true }],
    ]);
  },
  bwMenu(el) {
    menu(`${el.dataset.w} ${S.unit} · ${niceDate(el.dataset.date)}`, [
      ['Edit', 'editBw', { w: el.dataset.w, date: el.dataset.date }],
      ['Delete entry', 'delBw', { id: el.dataset.id }, { danger: true }],
    ]);
  },

  // ---------- what the menu items do ----------
  focusName() { const n = $('#wname'); n.focus(); n.select(); },
  pickDate() { const d = $('#wdate'); try { d.showPicker(); } catch { d.focus(); d.click(); } },
  async shareWorkout(el) {
    const id = +el.dataset.id;
    const w = S.wk && S.wk.id === rid(id) ? S.wk : await get('/workouts/' + rid(id));
    const m = workoutMeta(w), text = workoutText(w);
    if (navigator.share) {
      try { await navigator.share({ title: m.name, text }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    try { await navigator.clipboard.writeText(text); toast('Copied to clipboard'); } catch { prompt('Copy this text', text); }
  },
  async repeatWorkout(el) {
    const src = S.wk && S.wk.id === rid(+el.dataset.id) ? S.wk : await get('/workouts/' + rid(+el.dataset.id));
    const id = A.startWorkout(workoutMeta(src).name, workoutCards(src).map((c) => c.exercise_id));
    const view = { type: 'workout', id };
    await (S.view && S.view.type === 'workout' ? setRoute(S.tab, view, false) : go(view));
    toast('New workout with the same exercises');
  },
  deleteWorkout(el) {
    const id = rid(+el.dataset.id);
    if (!confirm('Delete this workout and all its sets?')) return;
    outbox = outbox.filter((op) => rid(op.wid) !== id || op.id === sendingId); saveOutbox();
    // A workout that never reached the server only needs forgetting, unless it is being sent right now.
    if (id > 0 || outbox.some((op) => op.wid === id)) queue({ kind: 'delWorkout', wid: id });
    if (rid(store.get('gt_active')) === id) store.set('gt_active', null);
    store.set('gt_pending_' + id, null); store.set(addedKey(id), null);
    store.set('gt_localw', store.get('gt_localw', []).filter((x) => x !== id));
    mem.delete('/workouts/' + id); store.set('gc:/workouts/' + id, null);
    touchAll();
    if (S.view && S.view.type === 'workout' && rid(S.view.id) === id) goBack();
    else render({ soft: true });
    toast('Workout deleted');
  },
  repeatSet(el) {
    const id = +el.dataset.id, s = workoutCards(S.wk).find((x) => x.exercise_id === id).sets.at(-1);
    logSets(id, [{ weight: s.weight, reps: s.reps, warmup: !!s.is_warmup, notes: s.notes || '' }]);
  },
  copyLast(el) {
    const id = +el.dataset.id, prev = prevOf(S.wk, id);
    logSets(id, prev.sets.map((s) => ({ weight: s.weight, reps: s.reps, warmup: !!s.is_warmup, notes: s.notes || '' })));
    toast(`Added ${prev.sets.length} set${prev.sets.length === 1 ? '' : 's'} from ${niceDate(prev.date)}`);
  },
  removeExercise(el) {
    const id = +el.dataset.id, c = workoutCards(S.wk).find((x) => x.exercise_id === id);
    if (c.sets.length && !confirm(`Remove ${c.name} and its ${c.sets.length} set${c.sets.length === 1 ? '' : 's'}?`)) return;
    for (const s of c.sets) {
      if (s.saving) { if (s.id !== sendingId) outbox = outbox.filter((o) => o.id !== s.id); }
      else outbox.push({ id: opId(), kind: 'delSet', wid: S.wk.id, setId: s.id });
    }
    saveOutbox();
    store.set('gt_pending_' + S.view.id, pendingOf(S.view.id).filter((x) => rid(x) !== id));
    pump();
    render({ soft: true });
  },
  dupSet(el) {
    const id = +el.dataset.id, c = workoutCards(S.wk).find((x) => x.sets.some((s) => s.id === id)), s = c.sets.find((x) => x.id === id);
    logSets(c.exercise_id, [{ weight: s.weight, reps: s.reps, warmup: !!s.is_warmup, notes: s.notes || '' }]);
  },
  toggleWarmSet(el) {
    const setId = +el.dataset.id, s = workoutCards(S.wk).flatMap((c) => c.sets).find((x) => x.id === setId);
    outbox = outbox.filter((o) => !(o.kind === 'editSet' && o.setId === setId && o.id !== sendingId));
    queue({ kind: 'editSet', wid: S.wk.id, setId, body: { weight: s.weight, reps: s.reps, rpe: s.rpe || null, warmup: !s.is_warmup, notes: s.notes || '' } });
    paintWorkout();
  },
  async editExerciseId(el) {
    const id = +el.dataset.id;
    S.ex = exById(id) || (await get('/exercises/' + id)).exercise;
    A.editExercise({ dataset: { id } });
  },
  addToWorkout(el) {
    const id = +el.dataset.id, wid = store.get('gt_active');
    addPending(wid, id);
    go({ type: 'workout', id: wid });
  },
  startWith(el) {
    const id = +el.dataset.id, e = exById(id) || S.ex || {};
    const wid = A.startWorkout(e.name ? `${e.name} session` : 'Workout');
    addPending(wid, id);
    go({ type: 'workout', id: wid });
  },
  editBw(el) {
    const v = $('#bwv'), d = $('#bwd');
    if (!v) return;
    v.value = el.dataset.w; d.value = el.dataset.date;
    v.scrollIntoView({ block: 'center' });
    v.focus();
    toast('Change the value and tap Save');
  },

  howInstall() { modal('Install Gym Log', `<div class="muted small" style="margin-bottom:6px">It opens full screen like a normal app and works without signal.</div>${installBody()}`); },
  noInstall() { store.set('gt_noinstall', 1); render({ soft: true }); },
  async install() { if (!installPrompt) return; installPrompt.prompt(); await installPrompt.userChoice; installPrompt = null; softRender(); },

  addBw() {
    const v = $('#bwv').value;
    if (!v) return toast('Enter a weight');
    queue({ kind: 'bw', body: { weight: +v, date: $('#bwd').value || localDate() } });
    $('#bwv').value = '';
    $('#bwv').blur();
    render({ soft: true });
    toast('Body weight saved');
  },
  delBw(el) { queue({ kind: 'delBw', bwId: +el.dataset.id }); render({ soft: true }); },
  async copyMcp(el) {
    const url = location.origin + '/mcp' + (el.dataset.k === '1' ? '/' + encodeURIComponent(S.token) : '');
    try { await navigator.clipboard.writeText(url); toast('Copied'); } catch { prompt('Copy this URL', url); }
  },
};

function fillPicker(q) {
  const t = q.trim().toLowerCase();
  const inWorkout = new Set(workoutCards(S.wk).map((c) => c.exercise_id));
  const list = [...localEx(), ...S.exercises].filter((e) => !t || e.name.toLowerCase().includes(t) || e.muscle_group.toLowerCase().includes(t))
    .sort((a, b) => (b.last_used || '').localeCompare(a.last_used || '') || a.name.localeCompare(b.name));
  const exact = [...localEx(), ...S.exercises].some((e) => e.name.toLowerCase() === t);
  $('#plist').innerHTML = (t && !exact ? `<div class="pick" data-a="choose" data-name="${esc(q.trim())}" style="color:var(--accent)">+ Create “${esc(q.trim())}”</div>` : '') +
    list.map((e) => `<div class="pick ex" data-a="choose" data-id="${e.id}">
      <div class="prow"><div class="pname">${esc(e.name)}${inWorkout.has(e.id) ? ' <span class="badge w">added</span>' : ''}</div><div class="muted small">${esc(e.muscle_group)}</div></div>
      ${e.last ? `<div class="pmeta"><span class="pk">Last</span> ${niceDate(e.last.date)} · ${ago(e.last.date)}<br><span class="pk"></span> ${lastLevel(e.last.sets)}</div>` : '<div class="pmeta">Never logged</div>'}
      ${e.pr ? `<div class="pmeta"><span class="pk">PR</span> <b>${recText(e.pr)}</b> · ${niceDate(e.pr.date)}</div>` : ''}</div>`).join('');
}

// ---------- events ----------
document.addEventListener('click', async (ev) => {
  if (ev.target.id === 'modal' && $('#modal').classList.contains('menu')) return closeModal();
  const el = ev.target.closest('[data-a]');
  if (!el || !A[el.dataset.a] || el.dataset.busy) return;
  try {
    const r = A[el.dataset.a](el);
    if (r && r.then) {
      el.dataset.busy = '1'; el.classList.add('busy');
      try { await r; } finally { delete el.dataset.busy; el.classList.remove('busy'); }
    }
  } catch (e) { toast(e.message); }
});
document.addEventListener('input', (ev) => {
  if (ev.target.id === 'pq') fillPicker(ev.target.value);
  if (ev.target.id === 'exq') $('#exlist').innerHTML = exerciseList(ev.target.value);
});
document.addEventListener('change', async (ev) => {
  const t = ev.target;
  try {
    const field = { wname: 'name', wnotes: 'notes', wdate: 'date' }[t.id];
    if (field && (t.value || field === 'notes')) queue({ kind: 'patchWorkout', wid: S.view.id, body: { [field]: t.value } });
    if (t.id === 'theme') applyTheme(t.value);
    if (t.id === 'unit') { await api('/settings', 'PUT', { unit: t.value }); S.unit = t.value; store.set('gt_unit', t.value); touchAll(); render({ soft: true }); }
  } catch (e) { toast(e.message); }
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') closeModal();
  if (ev.key !== 'Enter') return;
  const id = ev.target.id || '';
  if (/^w-\d+$/.test(id)) { ev.preventDefault(); $('#r-' + id.slice(2)).focus(); }
  else if (/^r-\d+$/.test(id)) { ev.preventDefault(); ev.target.blur(); $(`[data-a="addSet"][data-id="${id.slice(2)}"]`).click(); }
  else if (ev.target.tagName === 'INPUT' && ev.target.id !== 'key') ev.target.blur();
});
// Hide the tab bar while typing so it never sits on top of the keyboard, and select-all on focus for quick overwrite.
document.addEventListener('focusin', (ev) => {
  const t = ev.target;
  if (!/^(INPUT|TEXTAREA)$/.test(t.tagName) || t.type === 'date') return;
  document.body.classList.add('kb');
  if (t.type === 'number') setTimeout(() => { try { t.select(); } catch {} }, 0);
});
document.addEventListener('focusout', () => {
  setTimeout(() => {
    const a = document.activeElement;
    if (a && /^(INPUT|TEXTAREA)$/.test(a.tagName) && a.type !== 'date') return;
    document.body.classList.remove('kb');
    if (S.deferred) softRender();
  }, 80);
});
document.addEventListener('submit', async (ev) => {
  if (ev.target.id !== 'login') return;
  ev.preventDefault();
  const btn = ev.target.querySelector('button');
  btn.classList.add('busy');
  S.token = $('#key').value.trim();
  try {
    S.unit = (await api('/settings')).unit || 'kg';
    store.set('gt_token', S.token); store.set('gt_unit', S.unit);
    document.activeElement && document.activeElement.blur();
    render();
  } catch (e) { S.token = ''; btn.classList.remove('busy'); const le = $('#lerr'); if (le) le.textContent = e.message; }
});
setInterval(() => {
  const r = $('#rest');
  if (!r) return;
  const s = S.restAt ? Math.floor((Date.now() - S.restAt) / 1000) : -1;
  r.textContent = s >= 0 && s < 1800 ? `Rest ${Math.floor(s / 60)}:${pad(s % 60)}` : '';
}, 1000);

// ---------- start ----------
(function start() {
  pruneCache();
  history.replaceState({ tab: 'home', view: null, depth: 0 }, '');
  const active = rid(store.get('gt_active'));
  if (active !== store.get('gt_active')) store.set('gt_active', active);
  if (!outbox.length && Object.keys(idmap).length > 50) { idmap = {}; store.set('gt_idmap', {}); }
  if (S.token && active) {
    S.view = { type: 'workout', id: active };
    history.pushState({ tab: 'home', view: S.view, depth: 1 }, '');
  }
  render();
  pump();
  setTimeout(prefetch, 2500);
  window.addEventListener('online', () => setTimeout(prefetch, 1000));
  if (S.token) get('/settings').then((st) => { if (st.unit && st.unit !== S.unit) { S.unit = st.unit; store.set('gt_unit', st.unit); softRender(); } }).catch(() => {});
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/sw.js').catch(() => {});
})();
</script>
</body>
</html>
